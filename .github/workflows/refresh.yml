name: refresh-to-gitee

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 重测源，生成 mycfg.json / live.txt
        run: python3 refresh.py

      - name: 推送到 Gitee 仓库
        run: |
          set -e
          mkdir -p /tmp/out
          cp mycfg.json live.txt backup_configs.txt /tmp/out/
          git clone --depth 1 "https://qx_2026:${{ secrets.GITEE_TOKEN }}@gitee.com/qx_2026/mybox.git" gitee_repo
          cd gitee_repo
          cp /tmp/out/mycfg.json /tmp/out/live.txt /tmp/out/backup_configs.txt .
          git config user.name "gh-actions-bot"
          git config user.email "bot@example.com"
          git add mycfg.json live.txt backup_configs.txt
          if git diff --cached --quiet; then
            echo "源无变化，跳过提交"
            exit 0
          fi
          git commit -m "auto: refresh sources $(date -u +%F_%H%M)"
          git push origin master
